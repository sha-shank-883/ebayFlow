databases:
  - name: sellerflow-db
    databaseName: sellerflow
    user: sellerflow
    plan: free
    region: oregon
    postgresMajorVersion: "15"
    diskSizeGB: 1

services:
  - type: web
    name: sellerflow-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sellerflow-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
    disk:
      name: uploads
      mountPath: /opt/render/project/backend/uploads
      sizeGB: 1
