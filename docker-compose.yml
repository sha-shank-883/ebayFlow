# Docker Compose for SellerFlow AI - Local Development
#
# Usage:
#   1. Copy .env.example to .env and fill in your values:
#      cp .env.example .env
#
#   2. Start all services:
#      docker compose up -d
#
#   3. View logs:
#      docker compose logs -f
#
#   4. Stop all services:
#      docker compose down
#
#   5. Stop and remove volumes (resets database):
#      docker compose down -v
#
#   6. Rebuild services after code changes:
#      docker compose up -d --build

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: sellerflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sellerflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sellerflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: sellerflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sellerflow-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads-data:${UPLOAD_DIR:-./uploads}
    networks:
      - app-network

  # Frontend (Next.js) service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sellerflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - app-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local

networks:
  app-network:
    driver: bridge
